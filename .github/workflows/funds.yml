# TEFAS fon verisi: data-pipeline/sync.py ile çekilir, fund-data dalında saklanır ve
# GitHub Pages'te /funds altında yayınlanır (feed.json ve web sayfalarıyla birlikte).
#
# Saatler UTC; Türkiye UTC+3:
#   05:30 UTC = 08:30 TSİ  ana çekim
#   07:00 UTC = 10:00 TSİ  tamamlama turu (son günü ve eksik fonları yeniden çeker)
#
# Hata olursa iş kırmızı görünür ve GitHub sana e-posta atar; fund-data dalına ve Pages'e
# dokunulmaz, yani eski veri yerinde kalır. fund-data dalı her seferinde tek commit olarak
# yeniden yazılır, böylece 5 yıllık geçmiş repoyu her gün büyütmez.
#
# Windows yedeği (data-pipeline/windows-sync.bat) fund-data dalına push edince bu iş akışı
# kendini main üzerinde "publish" moduyla yeniden başlatır ve yalnızca yayınlar.

name: Fon verisi

on:
  schedule:
    - cron: '30 5 * * 1-5'
    - cron: '0 7 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'main: yeni günler · topup: son günü yeniden çek · publish: çekmeden yalnızca yayınla'
        type: choice
        options: [main, topup, publish]
        default: main
  # fund-data: Windows yedeğinin push'u · main: bu iş akışı ya da betik değişince yeniden yayınla
  push:
    branches: [fund-data, main]
    paths: ['funds/**', 'us/**', 'data-pipeline/**', '.github/workflows/funds.yml', 'feed/us-universe.json']

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

# Veri akışı iş akışıyla aynı grup: iki Pages yayını üst üste binmesin.
concurrency:
  group: feed
  cancel-in-progress: false

jobs:
  # GitHub Pages yalnızca main'den tetiklenen yayına izin verir. Push gelince bu iş akışını
  # main üzerinde yeniden başlat: fund-data'dan gelirse "publish", main'den gelirse "main".
  relay:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: main üzerinde yayını başlat
        env:
          GH_TOKEN: ${{ github.token }}
        # fund-data (Windows yedeği): yalnızca yayınla · main (betik değişti): normal çekimle çalıştır
        run: |
          MODE=publish
          if [[ "${{ github.ref_name }}" == "main" ]]; then MODE=main; fi
          gh workflow run funds.yml --repo "${{ github.repository }}" --ref main -f mode="$MODE"

  build:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Uygulama deposu (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: app

      - name: Fon verisi dalı (fund-data)
        id: data
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: fund-data
          path: data

      - name: İlk çalıştırma için boş veri klasörü
        if: steps.data.outcome == 'failure'
        run: mkdir -p data && cd data && git init -q -b fund-data && git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"

      - uses: actions/setup-python@v5
        if: inputs.mode != 'publish'
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: app/data-pipeline/requirements.txt

      - name: Bağımlılıklar
        if: inputs.mode != 'publish'
        run: pip install -r app/data-pipeline/requirements.txt

      - name: TEFAS senkronu
        if: inputs.mode != 'publish'
        run: |
          MODE=main
          if [[ "${{ github.event.schedule }}" == "0 7 * * 1-5" ]]; then MODE=topup; fi
          if [[ -n "${{ inputs.mode }}" ]]; then MODE="${{ inputs.mode }}"; fi
          python app/data-pipeline/sync.py --out data --mode "$MODE"

      # ABD hisse, ETF ve kripto geçmişi (alış günü fiyatı için). Alpha Vantage'ın ücretsiz
      # hakkı günde 25 istek: her çalıştırma en fazla 10 sembol yükler, ilk yükleme birkaç günde
      # tamamlanır. Bir sorun TEFAS verisinin yayınını engellemesin diye adım hatası işi düşürmez.
      - name: ABD fiyat geçmişi
        if: inputs.mode != 'publish'
        continue-on-error: true
        env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        run: python app/data-pipeline/us_history.py --out data --universe app/feed/us-universe.json --feed app/feed/public/feed.json --budget 10

      - name: fund-data dalına kaydet (tek commit)
        if: inputs.mode != 'publish'
        working-directory: data
        run: |
          git config user.name "fon-verisi[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain)" ]]; then
            git checkout -q --orphan snapshot
            git add -A
            git commit -q -m "Fon verisi: $(jq -r .lastDate funds/meta.json) ($(jq -r .fundCount funds/meta.json) fon) · ABD geçmişi bekleyen: $(jq -r '.remaining | length' us/meta.json 2>/dev/null || echo -)"
            git push -f origin snapshot:fund-data
          else
            echo "Değişiklik yok."
          fi

      - name: Pages içeriğini hazırla
        run: |
          mkdir -p _site
          cp -r app/feed/public/. _site/
          if [[ -d data/funds ]]; then cp -r data/funds _site/funds; fi
          if [[ -d data/us ]]; then cp -r data/us _site/us; fi
          test -f _site/feed.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
